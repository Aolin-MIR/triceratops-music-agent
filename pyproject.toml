[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2music"
version = "0.9.0"
description = "Triceratops Music Agent for REAPER"
authors = [
    {name = "Keshav Bhandari", email = "keshavbhandari@gmail.com"}
]
readme = "readme.md"

# Dependencies
dependencies = [
    "transformers",
    "accelerate",
    "wandb",
    "abctoolkit==0.0.6",
    "openai",
    "samplings==0.1.7",
    "pyparsing==3.2.1",
    "gradio",
    "partitura==1.6.0",
    "mido",
    "music21",
    "jellyfish",
    "unidecode",
    "rapidfuzz",
    "pyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["text2music", "text2music.*"]

[project.optional-dependencies]
audio = [
    "numpy>=1.26,<2",
    "librosa==0.11.0",
    "soundfile>=0.13",
    "demucs==4.1.0",
    "basic-pitch[onnx]==0.4.0",
    "onnxruntime==1.23.2"
]

[tool.setuptools.exclude-package-data]
"text2music" = ["artifacts/*"]
