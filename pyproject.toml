[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2music"
version = "1.0.1.post2"  # Python packaging equivalent of public hotfix 1.0.1b.
description = "Triceratops Music Agent"
readme = "readme.md"
requires-python = ">=3.10,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["vst3/installer/requirements-runtime.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["text2music", "text2music.agent", "text2music.agent.*"]

[tool.setuptools.package-data]
"text2music.agent" = ["reaper/*.lua"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
